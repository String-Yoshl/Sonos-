# sonos-sleep-bgm 設定ファイルの例。
# このファイルを config.yaml にコピーして自分の環境に合わせて編集してください。
#   cp config.example.yaml config.yaml

# 再生元にする Sonos の部屋(ゾーン)名。Sonos アプリに表示されている名前と一致させること。
room: "主書斎"

# 毎日再生を開始する時刻 (HH:MM, 24時間表記)。
# 睡眠 BGM なので既定は夜 9 時 (21:00)。朝 9 時にしたい場合は "09:00" にする。
schedule_time: "21:00"

# --- 再生する音源は bgm_favorite か bgm_uri のどちらかを指定する ---

# (推奨) Sonos アプリに登録したお気に入りの名前。
# `list-favorites` コマンドで登録済みの名前を確認できる。
bgm_favorite: "Sleep BGM"

# お気に入りを使わず URI を直接指定する場合はこちら (bgm_favorite はコメントアウト)。
# 例: ラジオ局のストリーム URL や、自宅で配信しているローカルファイルの HTTP URL。
# bgm_uri: "http://192.168.1.50:8000/sleep.mp3"

# 再生時の音量 (0-100)。null にすると音量を変更しない。
volume: 18

# 0 より大きい値にすると、その秒数をかけて目標音量までフェードインする。
fade_in_seconds: 30

# スケジューラが使うタイムゾーン。
timezone: "Asia/Tokyo"
